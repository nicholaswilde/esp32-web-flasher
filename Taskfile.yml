version: '3'

tasks:
  setup:
    desc: Install all required project dependencies (Node, Python, and testing tools)
    cmds:
      - npm install
      - npx playwright install chromium
      - uv sync

  serve:
    desc: Serve the static site locally on port 8000
    cmds:
      - uv run python -m http.server -d public 8000

  format:
    desc: Format code using Prettier
    cmds:
      - npx prettier --write "**/*.{html,css,js,json}"

  download:
    desc: Download and extract firmware releases
    cmds:
      - bash scripts/download_releases.sh

  add-repo:
    desc: Add a new GitHub repository to the project and download its releases
    cmds:
      - bash scripts/add_repo.sh {{.CLI_ARGS}}

  test:
    desc: Run both Python backend tests and Playwright frontend tests
    cmds:
      - uv run pytest --cov=scripts tests/
      - npx playwright test

  coveralls:
    desc: Upload coverage to coveralls.io (requires COVERALLS_REPO_TOKEN in .env)
    dotenv: ['.env']
    cmds:
      - uv run coveralls

  default:
    cmds:
      - task -l
    silent: true
