version: '3'

tasks:
  setup:
    desc: Install all required project dependencies (Node, Python, and testing tools)
    cmds:
      - npm install
      - npx playwright install chromium
      - uv sync

  serve:
    desc: Serve the static site locally on port 8000
    cmds:
      - uv run python -m http.server -d public 8000

  format:
    desc: Format code using Prettier
    cmds:
      - npx prettier --write "**/*.{html,css,js,json}"

  download:
    desc: Download and extract firmware releases
    cmds:
      - bash scripts/download_releases.sh

  add-repo:
    desc: Add a new GitHub repository to the project and download its releases
    cmds:
      - bash scripts/add_repo.sh {{.CLI_ARGS}}

  test:
    desc: Run both Python backend tests and Playwright frontend tests
    cmds:
      - uv run pytest --cov=scripts --cov-report=term --cov-report=lcov tests/
      - npx playwright test

  coveralls:
    desc: Upload coverage to coveralls.io (requires COVERALLS_REPO_TOKEN in .env)
    dotenv: ['.env']
    cmds:
      - uv run coveralls

  docker:build:
    desc: Build the Docker container image
    cmds:
      - docker build -t esp32-web-flasher:latest .

  docker:run:
    desc: Run the Docker container image locally with volume mounts
    cmds:
      - docker run --rm -p 8000:80 -v ./public/firmware:/usr/share/nginx/html/firmware -v ./public/config.json:/usr/share/nginx/html/config.json:ro esp32-web-flasher:latest

  docker:up:
    desc: Start the Docker container using Docker Compose
    cmds:
      - docker compose up -d

  docker:down:
    desc: Stop the Docker container using Docker Compose
    cmds:
      - docker compose down

  docker:logs:
    desc: View the Docker container logs using Docker Compose
    cmds:
      - docker compose logs -f

  docker:test:
    desc: Run Docker container scaffolding and runtime integration tests
    cmds:
      - uv run pytest tests/test_docker.py

  default:
    cmds:
      - task -l
    silent: true
